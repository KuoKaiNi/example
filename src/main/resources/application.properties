spring.application.name=holdings
server.port=8080

# 本機開發用的資料庫，帳密與 docker-compose.yml 相同；正式環境用環境變數 DB_URL / DB_USER / DB_PASSWORD 蓋掉
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/holdings?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Taipei}
spring.datasource.username=${DB_USER:holdings}
spring.datasource.password=${DB_PASSWORD:holdings}

# 資料表一律由 Flyway 建立，Hibernate 只檢查不動表
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
