services:
  mysql:
    image: docker.io/library/mysql:8.4
    environment:
      MYSQL_DATABASE: holdings
      MYSQL_USER: holdings
      MYSQL_PASSWORD: holdings
      MYSQL_ROOT_PASSWORD: holdings-root
    ports:
      - "3307:3306"
    volumes:
      - holdings-data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
volumes:
  holdings-data:
